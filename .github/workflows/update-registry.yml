name: Update verified DoH registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-registry.yml"
      - "update_registry.pyc"
      - "encrypt_registry.pyc"
      - "sources.json"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: doh-registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check cryptography
      - name: Collect and strictly validate DoH resolvers
        run: >-
          python3 -u update_registry.pyc
          --passes 3
          --workers 32
          --timeout 6
          --limit 10
      - name: Publish changed registry
        shell: bash
        run: |
          if git diff --quiet -- registry.bin; then
            echo "Registry is unchanged"
            exit 0
          fi
          git config user.name "LUMEX DoH Bot"
          git config user.email "support@lumexvpn.pro"
          git add registry.bin
          git commit -m "chore: refresh verified DoH registry"
          git push
